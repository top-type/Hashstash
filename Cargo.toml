[package]
name = "hashstash"
version = "0.42.0"
edition = "2024"
default-run = "hashstash"
description = "Hashstash account-based SHA256d blockchain node"
license = "MIT"

[features]
# Explicitly isolated funding for fast local integration fixtures. Normal builds
# reject configurations that request it; the flag is part of the chain identity.
test-fixtures = []

[dependencies]
anyhow = "1"
# Consensus bytes come from bincode, serde's data model and num-bigint's own
# u32-limb serde format (state commitments), so these are pinned exactly. An
# update must leave tests/codec_vectors.rs and tests/commitment_encoding.rs
# unchanged; bincode 1.x is unmaintained but must stay byte-identical.
bincode = "=1.3.3"
bech32 = "=0.11.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-bigint = { version = "=0.4.8", features = ["serde"] }
num-traits = "0.2"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
getrandom = "0.3"
zeroize = "1"
# The bundled SQLite (3.51.3 in libsqlite3-sys 0.37) includes the 2025 CVE fixes.
# fallible_uint keeps the u64/usize conversions that refuse values above i64::MAX.
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true


# Funded end-to-end fixtures need the explicitly marked simulation build.


[package]
name = "hashstash"
version = "0.37.0"
edition = "2024"
default-run = "hashstash"
description = "Hashstash account-based SHA256d blockchain node"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = "=1.3.3"
bech32 = "=0.11.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
getrandom = "0.3"
zeroize = "1"
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true


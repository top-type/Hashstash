# The validation gate of docs/VALIDATION.md on Linux and Windows, plus
# bounded fuzzing of the parsers that read hostile input. Every job uses
# disposable local processes and OS-chosen or job-local ports only. Within a
# job, each check runs once the build it needs succeeded, even after another
# check failed, so one run reports every failing check.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly: longer fuzzing and the live three-node network suites.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds of libFuzzer time per target
        default: '300'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the gate was last recorded with (docs/VALIDATION.md). Bump
  # it deliberately: a newer Clippy can add lints the gate denies.
  RUST_TOOLCHAIN: '1.97.1'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Repository crate
        run: cargo fmt --check
      - name: Fuzz crate
        if: ${{ !cancelled() }}
        run: rustfmt --check --edition 2024 fuzz/src/lib.rs fuzz/fuzz_targets/*.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with test fixtures
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked --features test-fixtures --target-dir target/fixtures -- -D warnings

  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build
        id: build
        run: |
          cargo build --release --locked --bins
          cargo build --release --locked --bins --features test-fixtures --target-dir target/fixtures
      - name: Rust tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --all-targets --locked
      - name: Rust tests with test fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --all-targets --locked --features test-fixtures --target-dir target/fixtures
      - name: Frontend suites
        if: ${{ !cancelled() }}
        run: |
          node scripts/test_all_frontend.cjs
          node fuzz/js/mail_envelope.cjs
      - name: Python unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HASHSTASH_TEST_BINARY: ${{ github.workspace }}/target/release/hashstash
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Python wallet, address and mail programs on disposable nodes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          fixtures=target/fixtures/release
          mkdir -p work/reports
          python3 -B scripts/test_wallet_cli.py --node $fixtures/hashstash --cold $fixtures/hashstash-cold --directory work --report work/reports/wallet-cli.json
          python3 -B scripts/test_wallet_manager.py --node $fixtures/hashstash --cold $fixtures/hashstash-cold --directory work --report work/reports/wallet-manager.json
          python3 -B scripts/test_addresses.py --node $fixtures/hashstash --cold $fixtures/hashstash-cold --directory work --report work/reports/addresses.json
          python3 -B scripts/test_wallet_adversarial.py --node $fixtures/hashstash --cold $fixtures/hashstash-cold --directory work/adversarial --base-port 38480 --report work/reports/wallet-adversarial.json
          python3 -B scripts/test_mail_wire.py --binary $fixtures/hashstash --report work/reports/mail-wire.json
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-reports
          path: work/reports
          if-no-files-found: ignore

  windows:
    name: Tests (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build
        id: build
        run: cargo build --release --locked --bins
      - name: Rust tests with test fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --all-targets --locked --features test-fixtures --target-dir target/fixtures
      - name: Owner-only secret files on NTFS
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Reads each secret file's access list back with icacls.
        run: cargo test --release --locked --lib --target-dir target/fixtures --features test-fixtures windows_ -- --nocapture
      - name: Cold signer launcher token hand-off
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: .\scripts\test_cold_launcher.ps1 -Executable .\target\release\hashstash-cold.exe -Port 21980 -Report work\cold-launcher-report.json
      - name: Launchers under Windows PowerShell 5.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The PowerShell Windows ships, started with -File as a shortcut or a
        # scheduled task starts a script; PowerShell 7 hides its differences.
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_rental_launcher_guard.ps1 -Executable .\target\release\hashstash.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_launcher.ps1 -Executable .\target\release\hashstash.exe -DataRoot work\launcher-ps51 -ReportPath work\launcher-ps51-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend suites
        if: ${{ !cancelled() }}
        run: |
          node scripts/test_all_frontend.cjs
          node fuzz/js/mail_envelope.cjs
      - name: Clippy, including the Windows-only access-list code
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with test fixtures
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked --features test-fixtures --target-dir target/fixtures -- -D warnings
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports
          path: work
          if-no-files-found: ignore

  fuzz:
    # Every push and pull request fuzzes all targets in one job, one minute
    # each. The nightly and manual runs give each target its own job, time
    # limit and corpus, so one target's time or failure never cuts another's.
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Every target in fuzz/Cargo.toml; tests/fuzz_parsers.rs checks this list.
        target: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["peer_wire","peer_channel","codec_transaction","codec_block","json","http_request","rpc_params","address","signed_record","unsigned_envelope","mail_envelope","plain_text","address_book","stratum_session"]' || '["all"]') }}
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || (github.event_name == 'schedule' && '900' || '60') }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Restore the corpus the last nightly run kept
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Seed corpora from the shared targets
        env:
          HASHSTASH_FUZZ_CORPUS: ${{ github.workspace }}/fuzz/corpus
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --release --locked --features test-fixtures --test fuzz_parsers -- --ignored write_seed_corpus
      - name: libFuzzer
        run: |
          # Shared dependencies resolve to the versions the node ships with.
          cp Cargo.lock fuzz/Cargo.lock
          if [ "$TARGET" = all ]; then
            cargo +nightly fuzz build --release
            targets=$(cargo +nightly fuzz list)
          else
            cargo +nightly fuzz build --release "$TARGET"
            targets=$TARGET
          fi
          # The RPC target's fixture node lives for the whole process by design,
          # so leak detection is left to the sanitizer's ordinary error checks.
          for target in $targets; do
            echo "::group::$target"
            cargo +nightly fuzz run --release "$target" "fuzz/corpus/$target" -- \
              -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096 -timeout=30 -detect_leaks=0 -print_final_stats=1
            echo "::endgroup::"
          done
      - name: Seeded stable runner from the same corpus, bounded time
        if: matrix.target != 'all'
        env:
          HASHSTASH_FUZZ_SECONDS: '600'
          HASHSTASH_FUZZ_TARGETS: ${{ matrix.target }}
          HASHSTASH_FUZZ_CORPUS: ${{ github.workspace }}/fuzz/corpus
          HASHSTASH_FUZZ_ARTIFACTS: ${{ github.workspace }}/fuzz/artifacts/stable
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --release --locked --features test-fixtures --test fuzz_parsers -- --ignored --nocapture fuzz_for_a_bounded_time
      - name: Minimize the corpus
        if: matrix.target != 'all'
        run: cargo +nightly fuzz cmin --release "$TARGET" "fuzz/corpus/$TARGET" -- -rss_limit_mb=4096 -timeout=30 -detect_leaks=0
      - name: Keep the corpus for the next runs
        # Also after a failure: the inputs that found it are kept separately.
        if: ${{ !cancelled() && matrix.target != 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep failing inputs
        # Last, so it also keeps what the stable runner found.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  fuzz-corpus:
    # The next runs, nightly and per push, start from each target's corpus as
    # the last nightly run left it; a target whose job kept none keeps its
    # previous corpus.
    name: Keep the nightly fuzz corpora
    needs: fuzz
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Restore the previous corpora
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Collect the corpora this run kept
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-corpus-*
          path: kept
      - name: Replace each kept target's corpus
        run: |
          mkdir -p fuzz/corpus
          for kept in kept/fuzz-corpus-*; do
            [ -d "$kept" ] || continue
            target=${kept#kept/fuzz-corpus-}
            rm -rf "fuzz/corpus/$target"
            mv "$kept" "fuzz/corpus/$target"
          done
          du -sh fuzz/corpus/* || true
      - name: Save the corpora
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

  network:
    name: Live fixture network suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the fixture executable
        id: build
        run: cargo build --release --locked --bins --features test-fixtures --target-dir target/fixtures
      - name: Network, adversarial-economics and load suites on one funded network
        run: bash scripts/ci_network_suites.sh target/fixtures/release/hashstash work/network/funded 38480
      - name: Reserve suite on a fresh network
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/ci_network_suites.sh target/fixtures/release/hashstash work/network/reserve 38480 test_reserve_network
      - name: Keep reports and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-reports
          path: work/network
          if-no-files-found: ignore

# Coverage-guided fuzzing of the parsers that read hostile input. The targets
# and their invariants live in src/lib.rs, which tests/fuzz_parsers.rs also
# runs on the stable toolchain; see docs/VALIDATION.md for both workflows.
#   cargo +nightly fuzz run peer_wire -- -max_total_time=300
[package]
name = "hashstash-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Accelerated test issuance funds the fixture node's miner, so RPC inputs
# reach quotes and preparation for an account that exists.
hashstash = { path = "..", features = ["test-fixtures"] }
hex = "0.4"
# CI copies the node's Cargo.lock here, which fixes every shared dependency;
# the fuzzer runtime, which no lockfile here records, is pinned exactly.
libfuzzer-sys = "=0.4.13"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[lib]
name = "hashstash_fuzz"
path = "src/lib.rs"

# The shipped release profile checks arithmetic overflow; so does fuzzing.
[profile.release]
debug = 1
overflow-checks = true

# Not a member of any enclosing workspace.
[workspace]
members = ["."]

[[bin]]
name = "peer_wire"
path = "fuzz_targets/peer_wire.rs"
test = false
doc = false
bench = false

